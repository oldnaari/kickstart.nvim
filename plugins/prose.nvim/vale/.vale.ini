# Prose linter config for the whole nvim setup (all markdown buffers).
# Lives in the nvim repo so it travels to remote hosts with `git clone`.
#
# Only the custom `Prompt` style is enabled. Vale's built-in `Vale` style is
# left out on purpose: its Spelling rule would duplicate Neovim's spell check
# and flag every ML term.
#
# Prompt.LongSentenceHyRu is a script rule (styles/config/scripts/), not an
# `occurrence` rule like LongSentence: Vale cannot split Armenian into
# sentences, since it does not treat ։ as a sentence end, and its ASCII-only \w
# counts Armenian and Cyrillic words as zero.
#
# MinAlertLevel = warning hides `suggestion` rules (none at the moment). The
# checks that need grammar (passive voice and the rest) are not Vale rules: they
# run in the shared parser, see patterns/ and lua/prose/patterns.lua.

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Prompt
